<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="900" viewBox="0 0 1536 900" role="img" aria-labelledby="title desc">
  <title id="title">SEVEN ROOTS proposed packaging measurements</title>
  <desc id="desc">Technical measurement board for the Travel Sleeve, Daily Ritual, and Family Reserve packages. All measurements are proposed and require physical sample validation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C86C3A"/></marker>
    <pattern id="fiber" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M0 35L35 0M18 36L36 18" stroke="#173D32" stroke-opacity=".045" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#102B24" flood-opacity=".12"/></filter>
    <style>
      .eyebrow{font:700 15px Arial,sans-serif;letter-spacing:4px;fill:#C86C3A}.title{font:500 46px Georgia,serif;fill:#102B24}.sub{font:400 16px Arial,sans-serif;fill:#5A5D51}.name{font:500 27px Georgia,serif;fill:#102B24}.sku{font:700 12px Arial,sans-serif;letter-spacing:2px;fill:#C86C3A}.dim{font:700 14px Arial,sans-serif;fill:#C86C3A}.small{font:400 13px Arial,sans-serif;fill:#5A5D51}.pack{fill:#173D32;stroke:#102B24;stroke-width:2;filter:url(#shadow)}.band{fill:#C86C3A}.gold{fill:none;stroke:#D6AE62;stroke-width:2}.measure{fill:none;stroke:#C86C3A;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}.guide{fill:none;stroke:#C86C3A;stroke-width:1;stroke-dasharray:5 5}.panel{fill:#F8F2E7;stroke:#D8CFBF;stroke-width:1}
    </style>
  </defs>
  <rect width="1536" height="900" fill="#F2E8D8"/><rect width="1536" height="900" fill="url(#fiber)"/>
  <text x="90" y="76" class="eyebrow">SEVEN ROOTS · PACKAGING ENGINEERING</text>
  <text x="90" y="136" class="title">Proposed finished-pack measurements</text>
  <text x="90" y="170" class="sub">Dimensions are L × W × D unless shown vertically. Confirm against conditioned product samples and converter dielines before production.</text>

  <g aria-label="Travel Sleeve measurements">
    <text x="92" y="236" class="sku">SR-T01 · 1 STICK</text><text x="92" y="272" class="name">Travel Sleeve</text>
    <rect x="145" y="326" width="92" height="318" rx="4" class="pack"/><rect x="145" y="548" width="92" height="72" class="band"/>
    <path d="M172 386h38M191 367v38M178 374l26 26M204 374l-26 26" class="gold"/>
    <rect x="260" y="326" width="52" height="318" rx="3" class="pack"/><rect x="260" y="548" width="52" height="72" class="band"/>
    <line x1="118" y1="326" x2="118" y2="644" class="measure"/><text x="108" y="502" class="dim" text-anchor="middle" transform="rotate(-90 108 502)">190 mm · 7.48 in</text>
    <line x1="145" y1="674" x2="237" y2="674" class="measure"/><text x="191" y="702" class="dim" text-anchor="middle">38 mm · 1.50 in</text>
    <line x1="260" y1="674" x2="312" y2="674" class="measure"/><text x="286" y="733" class="dim" text-anchor="middle">22 mm · 0.87 in depth</text>
  </g>

  <g aria-label="Daily Ritual measurements">
    <text x="486" y="236" class="sku">SR-R05 · 5 STICKS</text><text x="486" y="272" class="name">Daily Ritual</text>
    <rect x="514" y="358" width="360" height="198" rx="7" class="pack"/><rect x="514" y="485" width="360" height="46" class="band"/>
    <path d="M672 422h44M694 400v44M678 406l32 32M710 406l-32 32" class="gold"/>
    <polygon points="514,576 874,576 904,604 544,604" fill="#A97845" stroke="#102B24" stroke-width="2"/>
    <line x1="514" y1="636" x2="874" y2="636" class="measure"/><text x="694" y="664" class="dim" text-anchor="middle">200 mm · 7.87 in</text>
    <line x1="478" y1="358" x2="478" y2="556" class="measure"/><text x="466" y="457" class="dim" text-anchor="middle" transform="rotate(-90 466 457)">110 mm · 4.33 in</text>
    <line x1="544" y1="604" x2="514" y2="576" class="measure"/><line x1="904" y1="604" x2="874" y2="576" class="measure"/><text x="710" y="724" class="dim" text-anchor="middle">38 mm · 1.50 in depth</text>
  </g>

  <g aria-label="Family Reserve measurements">
    <text x="1000" y="236" class="sku">SR-F12 · 12 STICKS</text><text x="1000" y="272" class="name">Family Reserve</text>
    <rect x="1020" y="328" width="378" height="279" rx="8" class="pack"/><rect x="1020" y="491" width="378" height="58" class="band"/>
    <path d="M1184 420h50M1209 395v50M1191 402l36 36M1227 402l-36 36" class="gold"/>
    <polygon points="1020,628 1398,628 1434,666 1056,666" fill="#A97845" stroke="#102B24" stroke-width="2"/>
    <line x1="1020" y1="708" x2="1398" y2="708" class="measure"/><text x="1209" y="736" class="dim" text-anchor="middle">210 mm · 8.27 in</text>
    <line x1="984" y1="328" x2="984" y2="607" class="measure"/><text x="972" y="468" class="dim" text-anchor="middle" transform="rotate(-90 972 468)">155 mm · 6.10 in</text>
    <text x="1209" y="784" class="dim" text-anchor="middle">50 mm · 1.97 in depth</text>
  </g>

  <rect x="90" y="806" width="1356" height="62" rx="10" class="panel"/>
  <text x="118" y="833" class="sku">PRODUCT DATUM</text><text x="118" y="855" class="small">Target stick: 165 mm long × 10-14 mm diameter · Natural tolerance: ±10 mm length / ±3 mm diameter</text>
  <text x="790" y="833" class="sku">PRIMARY WRAP</text><text x="790" y="855" class="small">Finished cellulose pouch: 180 × 28 mm flat · Seal and barrier performance subject to shelf-life validation</text>
</svg>
